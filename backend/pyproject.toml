[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "options-chain-backend"
version = "0.1.0"
description = "FastAPI backend for the Options Chain App"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.16,<2.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "PyJWT>=2.10,<3.0",
    "cryptography>=43,<47",
    "websocket-client>=1.6,<2.0",
    "requests>=2.31,<3.0",
    "email-validator>=2.2,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff>=0.13,<1.0",
    "aiosqlite>=0.21,<1.0",
]
market-stream = [
    "aws-lambda-powertools==1.25.5",
    "setuptools<81",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
